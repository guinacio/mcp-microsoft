name: Release

# Two jobs around the same Dockerfile:
#
#   validate — on pull requests that touch the container inputs, build the
#              image (linux/amd64, no push) so a broken Docker build is caught
#              before release time instead of during one.
#   publish  — on published GitHub releases, build the multi-arch image and
#              push it to GitHub Container Registry, then attach a signed
#              build-provenance attestation to the image digest:
#
#                ghcr.io/guinacio/mcp-microsoft:<version>   (e.g. 0.10.0)
#                ghcr.io/guinacio/mcp-microsoft:<maj.min>   (e.g. 0.10)
#                ghcr.io/guinacio/mcp-microsoft:latest      (non-prerelease only)
#
# Registry auth uses the workflow's own GITHUB_TOKEN — no external registry
# credentials are stored in the repository. Third-party actions are pinned to
# commit SHAs (the trailing comment records the release tag each SHA came from).

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "src/**"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate container build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # amd64 only for fast PR feedback; the arm64 half is exercised by the
      # publish job at release time.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

  publish:
    name: Build & push Docker image (GHCR)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 layers are cross-built via QEMU so the image runs on Apple
      # Silicon / Graviton Kubernetes nodes as well as x86_64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SLSA build provenance, pushed to the registry alongside the image.
      # Verify with: gh attestation verify oci://ghcr.io/guinacio/mcp-microsoft:<tag> -R guinacio/mcp-microsoft
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
