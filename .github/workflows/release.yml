name: Release

# Builds and publishes the multi-arch Docker image for the multi-user
# Streamable HTTP server (see Dockerfile) whenever a GitHub release is
# published. Images land in GitHub Container Registry:
#
#   ghcr.io/guinacio/mcp-microsoft:<version>   (e.g. 0.10.0)
#   ghcr.io/guinacio/mcp-microsoft:<maj.min>   (e.g. 0.10)
#   ghcr.io/guinacio/mcp-microsoft:latest      (non-prerelease only)
#
# Authentication uses the workflow's own GITHUB_TOKEN — no external registry
# credentials are stored in the repository.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    name: Build & push Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 layers are cross-built via QEMU so the image runs on Apple
      # Silicon / Graviton Kubernetes nodes as well as x86_64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
