[project]
name = "mcp-microsoft"
version = "0.3.0"
description = "Microsoft 365 MCP server — Mail, Calendar, and OneDrive via Microsoft Graph API for personal (Outlook.com/Live) and enterprise (Azure AD/Entra) accounts"
readme = "README.md"
authors = [
    { name = "Guilherme Inácio", email = "gsilvainacio@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "msal>=1.28",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
mcp-microsoft = "mcp_microsoft.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
